server:
  port: 8080

spring:
  application:
    name: test-task-tracking
  
  datasource:
    url: jdbc:mysql://localhost:3306/test_tracking?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      read-date-timestamps-as-nanoseconds: false

jwt:
  secret: TestTrackingSecretKey2024ProductionEnvironmentWithEnhancedSecurityForHS512Algorithm
  expiration: 86400000 # 24小时

logging:
  level:
    com.testtracking: DEBUG
    org.springframework.security: DEBUG

# 钉钉通知配置
dingtalk:
  enabled: true  # 是否启用钉钉通知
  webhook:
    url: https://oapi.dingtalk.com/robot/send?access_token=98b6b18dfda2b07323b01b7050fce8a34ffce394815428c85eef1cff4ee41726  # 钉钉机器人webhook地址
  secret:   # 钉钉机器人签名密钥（可选）

# 数据库备份配置
backup:
  path: /backup  # 备份文件存储路径
  retention:
    days: 30  # 备份文件保留天数

# 定时任务配置
  task:
    scheduling:
      pool:
        size: 5 